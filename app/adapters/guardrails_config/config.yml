# Colang 2.x, guardrails-only: no `models:` section on purpose.
#
# 1.x is not an option here -- its runtime calls the LLM for intent
# classification before any rail runs, so a config with no model raises
# "No LLM provided to llm_call()". 2.x runs rails without one.
#
# Detection itself is ours (Presidio + custom regexes + Gemma-4 via
# LLMGuardrailRecognizer), registered as a custom action. NeMo's built-in
# `sensitive_data_detection` rail is deliberately unused: it is a thin wrapper
# over bare Presidio + spaCy, which we benchmarked at 0.433 average F1 against
# Gemma-4's 0.762, and it cannot see our UK_NINO/UK_POSTCODE/DOB recognizers.
colang_version: "2.x"
