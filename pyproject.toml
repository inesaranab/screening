[project]
name = "screening"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "en-core-web-sm",
    "fastapi[standard]>=0.139.2",
    "instructor>=1.15.4",
    "openai>=2.47.0",
    "pip>=26.1.2",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "protobuf>=7.35.1",
    "pydantic-settings>=2.14.2",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ty>=0.0.63",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["live: hits real models / network (slow)"]

[tool.fastapi]
entrypoint = "app.api.main:app"

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query()/Header() etc. in argument defaults is the idiomatic FastAPI
# pattern (dependency injection), not a mutable-default bug — exempt from B008.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Cookie",
    "fastapi.Security",
]
