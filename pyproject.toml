[project]
name = "screening"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "en-core-web-sm",
    "fastapi[standard]>=0.139.2",
    "gliner>=0.2.24",
    "instructor>=1.15.4",
    "openai>=2.47.0",
    "pip>=26.1.2",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "protobuf>=7.35.1",
    "pydantic-settings>=2.14.2",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "tdd-guard-pytest>=0.1.2",
    "ty>=0.0.63",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["live: hits real models / network (slow)", "prod: hits the deployed prod endpoint"]
tdd_guard_project_root = "/Users/inesarana/screening"

[tool.fastapi]
entrypoint = "app.api.main:app"
