# Pre-commit hooks. Setup:
#   uv tool install pre-commit     # or: pipx install pre-commit / brew install pre-commit
#   pre-commit install             # wire it into git (runs on every commit)
#   pre-commit install --hook-type pre-push  # wire the pre-push stage too (code review)
#   pre-commit run --all-files     # run now, against the whole repo
#
# Keep hook versions current with:  pre-commit autoupdate
repos:
  # Ruff — lint (with autofix) + format. Official Astral hook.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ty — Astral's type checker. Run via uvx so it needs no project dependency.
  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        entry: uvx ty check
        language: system
        types: [python]
        pass_filenames: false

      # Runs Claude's /code-review over the local diff before every push. If it
      # finds something to fix, it edits the files directly, then this hook
      # fails on purpose (git diff is non-empty) so the push is blocked and
      # you can review + commit the fix before pushing again.
      - id: code-review
        name: code-review (Claude, pre-push — fixes issues, then fails so you re-commit)
        entry: >-
          bash -c '
          claude -p "/code-review - fix anything you find directly in the files instead of just reporting it"
          --allowedTools "Read Grep Glob Edit Bash(git diff*) Bash(git log*) Bash(git status*)"
          --permission-mode bypassPermissions;
          git diff --quiet || { echo "code-review made changes - review, commit, and push again"; exit 1; }
          '
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        verbose: true
